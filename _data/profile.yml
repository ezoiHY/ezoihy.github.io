headline: Connecting algorithms, mechanisms, and robot control.
intro: I study robotics engineering at South China University of Technology. My interests include dexterous manipulation, underactuated mechanisms, and embodied intelligence. I hope to develop robotics technology into reliable, affordable products for everyday use.
bio:
  - Six years of training in informatics competitions gave me a foundation in algorithms and programming. I have since expanded into mechanical design, artificial intelligence, and control, working toward an engineering skill set that connects software, hardware, and physical robot systems.
  - I am interested in simpler, more reliable, and lower-cost approaches to dexterous manipulation. My work ranges from underactuated prosthetic hands and tendon transmission to monocular hand-motion retargeting, underwater biomimetic robots, and robot interaction using local language models.
  - I hope to connect academic research with practical applications. I am also learning about product development, teamwork, and how technology can address real user needs.
