headline: Research in dexterous manipulation, sensing, and embodied intelligence.
intro: I am pursuing a bachelor's degree in Robotics Engineering at South China University of Technology and work as a research assistant at PAIRS Lab, HKUST(GZ), supervised by Prof. Fangqiang Ding.
bio:
  - >-
    I study Robotics Engineering at [South China University of Technology](https://www.scut.edu.cn/), with graduation expected in 2027. I also work as a research assistant in [Prof. Fangqiang Ding](https://fangqiangding.com/)'s [PAIRS Lab](https://pairslab.github.io/) at [The Hong Kong University of Science and Technology (Guangzhou)](https://www.hkust-gz.edu.cn/).
  - >-
    My research interests include dexterous manipulation, multimodal sensing, force-aware robot learning, human sensing, and embodied intelligence. My work connects mechanism design with perception and control: I designed a [304 g, single-actuator prosthetic hand](/projects/underactuated-hand/) for adaptive grasping and developed [monocular RGB hand-motion retargeting](/projects/monocular-hand-control/) for a robotic hand in simulation. I have also worked on underwater visual recognition and natural-language robot control.
  - >-
    Before robotics, I spent six years (2016–2022) training and competing in informatics. That background in algorithms and programming informs my robot perception and control work, as well as the open-source tools I build: [PaperNAS](/projects/papernas/) for paper reading and research records, and [Hyadex](/projects/hyadex/) for coordinating coding agents.
research_interests:
  - title: Dexterous manipulation
    label: Dexterous Manipulation
    description: Robotic hand control, human hand-motion retargeting, and adaptive grasping.
    context: >-
      My prosthetic hand uses one actuator and a pulley-free tendon transmission for adaptive grasping. In a separate simulation project, I used monocular RGB hand poses and inverse kinematics to control an articulated robotic hand.
    links:
      - title: Hand retargeting
        url: /projects/monocular-hand-control/
      - title: Adaptive grasping
        url: /projects/underactuated-hand/
  - title: Multimodal sensing
    label: Multimodal Sensing
    description: Combining sensing modalities to inform robot perception and interaction.
    context: >-
      The PAIRS Lab wrist demonstration records muscle activity and inertial signals alongside hand gestures. It is a lab prototype that illustrates how different sensors can describe the same movement.
    links:
      - title: PAIRS Lab sensing demo
        url: /publications/#wrist-sensing
  - title: Force-aware robot learning
    label: Force-aware Robot Learning
    description: Learning to account for forces and physical interaction in robot behavior.
    context: >-
      My pulley-free hand distributes grasp forces through a mechanical transmission. That design motivates my interest in how a robot might learn from physical interaction. The hand project documents the mechanism and its grasp tests.
  - title: Human sensing
    label: Human Sensing
    description: Sensing human motion and behavior for human–robot interaction.
    context: >-
      I used RGB images to reconstruct human hand poses and retarget them to a robotic hand in simulation. The PAIRS Lab wrist prototype offers another view of hand gestures through muscle activity and inertial signals.
    context_link:
      title: RGB hand retargeting
      url: /projects/monocular-hand-control/
    links:
      - title: PAIRS Lab wrist demo
        url: /publications/#wrist-sensing
  - title: Embodied intelligence
    label: Embodied Intelligence
    description: Connecting perception, learning, and action in physical robot systems.
    context: >-
      For the Unitree Go1, I connected a local Qwen model to the robot's motion-control interface. The project includes a demonstration of the physical robot responding to language-guided control.
    links:
      - title: Language-controlled quadruped
        url: /projects/language-quadruped/
