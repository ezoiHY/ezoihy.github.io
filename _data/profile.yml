headline: Research in dexterous manipulation, sensing, and embodied intelligence.
intro: I am pursuing a bachelor's degree in Robotics Engineering at South China University of Technology and work as a research assistant at PAIRS Lab, HKUST(GZ), supervised by Prof. Fangqiang Ding.
bio:
  - >-
    I am pursuing a bachelor's degree in Robotics Engineering at [South China University of Technology](https://www.scut.edu.cn/), with graduation expected in 2027. I am also a research assistant at [PAIRS Lab](https://pairslab.github.io/), [The Hong Kong University of Science and Technology (Guangzhou)](https://www.hkust-gz.edu.cn/), supervised by [Prof. Fangqiang Ding](https://fangqiangding.com/).
  - >-
    My research interests include dexterous manipulation, multimodal sensing, force-aware robot learning, human sensing, and embodied intelligence. My projects span underactuated prosthetic hands, visual hand-motion retargeting, underwater robotics, and natural-language robot control.
  - >-
    Before turning to robotics, I spent six years (2016–2022) training and competing in informatics. This experience established my foundation in algorithms and programming, which I have since applied to robot perception, control, and system development.
