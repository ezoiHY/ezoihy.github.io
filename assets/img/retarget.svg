<title id="title">Human-to-robot hand retargeting — conceptual illustration</title>
<desc id="desc">Human hand landmarks on the left map to an articulated robotic hand on the right. Dashed correspondence arrows and matching joint chains illustrate motion retargeting conceptually, without measured results.</desc>
