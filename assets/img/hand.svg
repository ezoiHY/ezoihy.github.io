<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Tendon-driven robotic hand — conceptual illustration</title>
<desc id="desc">A conceptual pulley-free underactuated robotic hand with articulated finger links, direct cyan tendon routes, fixed tendon anchors and a wrist actuator. Finger circles mark articulation joints, not pulleys. This is a schematic, not a project photograph or an engineering specification.</desc>
