<title id="title">Bio-inspired robotic fish — conceptual illustration</title>
<desc id="desc">A streamlined robotic fish with a translucent shell, articulated tail, fin ribs and forward sensor wavefronts. The illustration is conceptual and does not represent a measured prototype.</desc>
